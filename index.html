<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8ff">
  <title>奶龙游戏</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Noto Sans SC", sans-serif;
      color: #2c5a14;
      background: radial-gradient(circle at 50% 0%, #d9f6ff 0%, #7ecbff 42%, #67b83a 100%);
    }
    main {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 18px 32px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 36px;
      color: #f0a000;
      text-shadow: 0 2px 0 #fff1bf;
    }
    .lead {
      text-align: center;
      font-weight: 700;
    }
    .games {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    a.game {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      padding: 18px 18px 16px;
      box-shadow: 0 10px 24px rgba(40, 90, 40, 0.14);
    }
    a.game strong {
      display: block;
      font-size: 24px;
      color: #ef9f00;
    }
    a.game span {
      display: block;
      margin-top: 6px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>奶龙游戏</h1>
    <p class="lead">点一个开始玩</p>
    <div class="games">
      <a class="game" href="nailong-marbles/">
        <strong>奶龙弹珠</strong>
        <span>把一样的奶龙射到一起，打掉指定个数就能过关。</span>
      </a>
      <a class="game" href="nailong-jump/">
        <strong>奶龙跳一跳</strong>
        <span>按住蓄力，松手起跳。跳到中心分数更高。</span>
      </a>
    </div>
  </main>
</body>
</html>
