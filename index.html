<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8ff">
  <title>奶龙游戏</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Noto Sans SC", sans-serif;
      color: #2c5a14;
      background: radial-gradient(circle at 50% 0%, #d9f6ff 0%, #7ecbff 42%, #67b83a 100%);
    }
    main {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 18px 32px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 36px;
      color: #f0a000;
      text-shadow: 0 2px 0 #fff1bf;
    }
    .lead {
      text-align: center;
      font-weight: 700;
    }
    .games {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    a.game {
      display: block;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 24px rgba(40, 90, 40, 0.14);
    }
    .shot {
      height: 176px;
      background-color: #e7f6c9;
      background-size: cover;
      background-position: center center;
    }
    .copy { padding: 14px 16px 16px; }
    a.game strong {
      display: block;
      font-size: 24px;
      color: #ef9f00;
    }
    a.game span {
      display: block;
      margin-top: 6px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>奶龙游戏</h1>
    <p class="lead">点一个开始玩</p>
    <div class="games">
      <a class="game marbles" href="nailong-marbles/">
        <div class="shot" style="background-image:url('nailong-marbles/assets/cover.jpg')"></div>
        <div class="copy">
          <strong>奶龙弹珠</strong>
          <span>把一样的奶龙射到一起，打掉指定个数就能过关。</span>
        </div>
      </a>
      <a class="game jump" href="nailong-jump/">
        <div class="shot" style="background-image:url('nailong-jump/assets/cover.jpg')"></div>
        <div class="copy">
          <strong>奶龙跳一跳</strong>
          <span>按住蓄力，沿直线跳。近的少按一会，远的要按得更久。</span>
        </div>
      </a>
      <a class="game tower" href="nailong-skyscraper/">
        <div class="shot" style="background-image:url('nailong-skyscraper/assets/cover.jpg')"></div>
        <div class="copy">
          <strong>奶龙摩天楼</strong>
          <span>楼层左右摆，点一下放下。叠得越正，入住的人越多。</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
