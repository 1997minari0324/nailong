<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="奶龙跳一跳">
  <title>奶龙跳一跳</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFC400'/%3E%3Ccircle cx='22' cy='26' r='7' fill='%233dcc4a'/%3E%3Ccircle cx='42' cy='26' r='7' fill='%233dcc4a'/%3E%3Cpath d='M22 42q10 8 20 0' stroke='%23c47b00' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="pill score-pill"><strong id="score">0</strong> 分</div>
      <div class="pill" id="best">最高 0</div>
      <div class="pill" id="combo">连击</div>
      <button id="mute" type="button" aria-label="声音">🔊</button>
    </header>
    <div id="board">
      <canvas id="game"></canvas>
      <div id="overlay" class="show">
        <div class="card" id="card"></div>
      </div>
    </div>
  </div>
  <div id="turn">请把手机竖过来玩</div>
  <script src="game.js?v=6"></script>

</html>
